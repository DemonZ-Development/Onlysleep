name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master, 1.26.x ]
  pull_request:
    branches: [ master, 1.26.x ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1.2'
            paper-api: '26.1.2.build.74-stable'
            paper-api-jvm: '25'
          - minecraft: '26.2'
            paper-api: '26.2.build.56-alpha'
            paper-api-jvm: '25'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon -PpaperApiVersion=${{ matrix.paper-api }} -PpaperApiJvmVersion=${{ matrix.paper-api-jvm }}

      - name: Upload build artifacts
        if: matrix.minecraft == '26.2'
        uses: actions/upload-artifact@v4
        with:
          name: Onlysleep
          path: |
            build/libs/Onlysleep-*.jar
            fabric/build/libs/Onlysleep-Fabric-*.jar
