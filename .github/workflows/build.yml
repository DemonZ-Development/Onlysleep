name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.4'
            paper-api: '1.20.4-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.20.5'
            paper-api: '1.20.5-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.20.6'
            paper-api: '1.20.6-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21'
            paper-api: '1.21-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.1'
            paper-api: '1.21.1-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.3'
            paper-api: '1.21.3-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.4'
            paper-api: '1.21.4-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.5'
            paper-api: '1.21.5-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.6'
            paper-api: '1.21.6-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.7'
            paper-api: '1.21.7-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.8'
            paper-api: '1.21.8-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.9'
            paper-api: '1.21.9-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.10'
            paper-api: '1.21.10-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '1.21.11'
            paper-api: '1.21.11-R0.1-SNAPSHOT'
            paper-api-jvm: '21'
          - minecraft: '26.1.2'
            paper-api: '26.1.2.build.74-stable'
            paper-api-jvm: '25'
          - minecraft: '26.2'
            paper-api: '26.2.build.56-alpha'
            paper-api-jvm: '25'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon -PpaperApiVersion=${{ matrix.paper-api }} -PpaperApiJvmVersion=${{ matrix.paper-api-jvm }}

      - name: Upload build artifacts
        if: matrix.minecraft == '1.20.4'
        uses: actions/upload-artifact@v4
        with:
          name: Onlysleep
          path: build/libs/Onlysleep-*.jar
