sleep-percentage: 50

skip-delay-ticks: 60

skip-type: instant

gradual-skip-speed-ticks: 30

morning-time: 1000

reset-time: true

per-world-sleep: true

require-all-players-online: false

# --- Weather Settings ---

# Clear rain (storms) when a player sleeps.
# Note: rain and thunder are handled independently below.
clear-weather: true

reset-weather: true

# Clear thunder (thunderstorms) when a player sleeps.
# Independent of clear-weather, so you can clear only one.
clear-thunder: true

reset-thunder: true

reset-weather-cycle: true

count-afk-as-sleeping: false

exclude-afk-from-total: true

count-spectators: false

count-flying: true

ignore-creative-mode: false

afk-detection:
  use-essentials: true
  use-cmi: true
  time-seconds: 300

ui:
  action-bar:
    enabled: true

  boss-bar:
    enabled: true
    color: BLUE
    style: SOLID

  progress-bar:
    enabled: true
    symbol: "■"
    length: 20

  title:
    enabled: false
    title: "&bGood Morning!"
    subtitle: "&fNight skipped by &b%player%"
    fade-in: 10
    stay: 70
    fade-out: 20

sounds:
  enabled: true
  # Sound played to everyone when the night is skipped
  skip-sound: ENTITY_PLAYER_LEVELUP
  skip-sound-volume: 1.0
  skip-sound-pitch: 1.0
  # Sound played to everyone when a player gets into bed
  night-sound: BLOCK_NOTE_BLOCK_PLING
  night-sound-volume: 0.5
  night-sound-pitch: 1.0
  # Sound played to everyone when a storm/thunderstorm is cleared by sleeping
  storm-sound: ENTITY_LIGHTNING_BOLT_THUNDER
  storm-sound-volume: 1.0
  storm-sound-pitch: 1.0

# --- Gamerule Management ---

# Automatically override vanilla's playersSleepingPercentage gamerule on
# enabled worlds so this plugin fully controls sleep math (sets it above 100,
# which prevents vanilla from skipping the night on its own).
# The original value is restored when the plugin disables.
manage-gamerule: true

check-for-updates: true

disabled-worlds: []

disabled-gamemodes: []
